  <linearGradient id="satin" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#BBA3D9"/><stop offset=".35" stop-color="#E9DDF6"/><stop offset=".6" stop-color="#D2BDEB"/><stop offset="1" stop-color="#A88FC9"/></linearGradient>
  <linearGradient id="satinV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#BBA3D9"/><stop offset=".35" stop-color="#E9DDF6"/><stop offset=".6" stop-color="#D2BDEB"/><stop offset="1" stop-color="#A88FC9"/></linearGradient>
  <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5A5350"/><stop offset=".5" stop-color="#2E2A28"/><stop offset="1" stop-color="#1E1B1A"/></linearGradient>
  <linearGradient id="pencil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F8E39A"/><stop offset=".45" stop-color="#F5D66C"/><stop offset="1" stop-color="#D9B54A"/></linearGradient>
  <radialGradient id="latte" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#E7CDAE"/><stop offset=".75" stop-color="#C79A6E"/><stop offset="1" stop-color="#A9784E"/></radialGradient>
