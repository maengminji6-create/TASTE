  <linearGradient id="faceL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#DED2C0"/><stop offset="1" stop-color="#ECE3D5"/></linearGradient>
  <linearGradient id="faceR" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#CDBFAB"/><stop offset="1" stop-color="#BFB09B"/></linearGradient>
  <linearGradient id="bandL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E9C658"/><stop offset="1" stop-color="#F5D66C"/></linearGradient>
  <linearGradient id="bandR" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#D9B54A"/><stop offset="1" stop-color="#CDA942"/></linearGradient>
  <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#F5D66C"/><circle cx="7" cy="7" r="2.4" fill="#FFF9EF"/></pattern>
  <pattern id="stripe" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="12" height="12" fill="#B9DDC7"/><rect width="5" height="12" fill="#E3F1E8"/></pattern>
  <pattern id="check" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#F6D5C5"/><rect width="8" height="8" fill="#EDBFAB"/><rect x="8" y="8" width="8" height="8" fill="#EDBFAB"/></pattern>
  <pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFFDF8"/><path d="M10 0V10H0" fill="none" stroke="#E6DDF2" stroke-width="1"/></pattern>
  <pattern id="knitp" width="16" height="14" patternUnits="userSpaceOnUse"><rect width="16" height="14" fill="#A9D2B9"/><path d="M1 1 L8 12 M15 1 L8 12" stroke="#C9E6D4" stroke-width="5" stroke-linecap="round"/><path d="M1 1 L8 12 M15 1 L8 12" stroke="#93C2A6" stroke-width="1" opacity=".6"/></pattern>
  <pattern id="rib" width="8" height="10" patternUnits="userSpaceOnUse"><rect width="8" height="10" fill="#9CC8AE"/><rect width="4" height="10" fill="#B9DDC7"/></pattern>
</defs><rect width="900" height="900" fill="url(#sweep)"/>
