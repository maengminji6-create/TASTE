<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" role="img" aria-label="라일락 리본을 묶은 취향수집소 선물 상자와 for you 태그, 카드 봉투, 튤립"><defs>
  <filter id="sh" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="4" dy="10" stdDeviation="9" flood-color="#4A3828" flood-opacity=".26"/></filter>
  <filter id="shs" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="1.5" dy="3" stdDeviation="2" flood-color="#4A3828" flood-opacity=".3"/></filter>
  <filter id="shw" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="8" dy="14" stdDeviation="8" flood-color="#5A4636" flood-opacity=".22"/></filter>
  <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="blur18" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="paper" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" seed="5" result="n"/>
    <feColorMatrix in="n" type="matrix" values=".16 0 0 0 .86  .16 0 0 0 .86  .16 0 0 0 .86  0 0 0 0 1" result="g"/>
    <feBlend in="SourceGraphic" in2="g" mode="multiply" result="b"/>
    <feComposite in="b" in2="SourceGraphic" operator="in"/>
  </filter>
  <filter id="linen" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".9 .035" numOctaves="2" seed="6" result="a"/>
    <feTurbulence type="fractalNoise" baseFrequency=".035 .9" numOctaves="2" seed="11" result="b"/>
    <feBlend in="a" in2="b" mode="multiply" result="ab"/>
    <feColorMatrix in="ab" type="matrix" values=".22 0 0 0 .8  .22 0 0 0 .78  .22 0 0 0 .74  0 0 0 0 1" result="g"/>
    <feBlend in="SourceGraphic" in2="g" mode="multiply"/>
  </filter>
  <filter id="wood" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".004 .09" numOctaves="4" seed="8" result="t"/>
    <feColorMatrix in="t" type="matrix" values=".5 0 0 0 .62  .5 0 0 0 .58  .5 0 0 0 .52  0 0 0 0 1" result="g"/>
    <feBlend in="SourceGraphic" in2="g" mode="multiply"/>
  </filter>
  <filter id="plaster" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".012" numOctaves="4" seed="13" result="t"/>
    <feColorMatrix in="t" type="matrix" values=".12 0 0 0 .9  .12 0 0 0 .89  .12 0 0 0 .87  0 0 0 0 1" result="g"/>
    <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="1" seed="2" result="f"/>
    <feColorMatrix in="f" type="matrix" values=".1 0 0 0 .92  .1 0 0 0 .92  .1 0 0 0 .92  0 0 0 0 1" result="h"/>
    <feBlend in="g" in2="h" mode="multiply" result="gh"/>
    <feBlend in="SourceGraphic" in2="gh" mode="multiply"/>
  </filter>
  <filter id="knit" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".6" numOctaves="2" seed="9" result="n"/>
    <feColorMatrix in="n" type="matrix" values=".25 0 0 0 .8  .25 0 0 0 .8  .25 0 0 0 .8  0 0 0 0 1" result="g"/>
    <feBlend in="SourceGraphic" in2="g" mode="multiply" result="b"/>
    <feComposite in="b" in2="SourceGraphic" operator="in"/>
  </filter>
  <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".18"/></linearGradient>
  <radialGradient id="light" cx=".22" cy=".12" r="1"><stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#5A4230" stop-opacity=".18"/></radialGradient>
  <linearGradient id="glue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C7B1E2"/><stop offset=".28" stop-color="#EEE4F8"/><stop offset=".55" stop-color="#D9C5EE"/><stop offset="1" stop-color="#A993C6"/></linearGradient>
