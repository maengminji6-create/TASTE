<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" role="img" aria-label="햇살 드는 창가 책상 위, 만들고 있는 콜라주 엽서와 라떼, 딱풀, 연필, 튤립 한 송이"><defs>
  <filter id="sh" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="4" dy="10" stdDeviation="9" flood-color="#4A3828" flood-opacity=".26"/></filter>
